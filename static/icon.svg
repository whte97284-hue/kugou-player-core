<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Retro Green Gradient -->
        <linearGradient id="terminalGreen" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#00ff41;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#008F11;stop-opacity:1" />
        </linearGradient>
        
        <!-- Scanline Pattern -->
        <pattern id="scanlines" x="0" y="0" width="512" height="4" patternUnits="userSpaceOnUse">
            <rect x="0" y="0" width="512" height="2" fill="#000" opacity="0.3"/>
        </pattern>

        <!-- Glow Filter -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- 1. Background Shell (Floppy/Monitor hybrid shape) -->
    <rect x="20" y="20" width="472" height="472" rx="40" ry="40" fill="#111111" stroke="#333" stroke-width="10"/>
    
    <!-- Inner Bezel -->
    <rect x="40" y="40" width="432" height="432" rx="20" ry="20" fill="#000000" stroke="#00ff41" stroke-width="2" opacity="0.5"/>

    <!-- 2. The Unlocked Shackle (Pixelated style) -->
    <path d="M 330 180 
             L 330 140 
             C 330 100 300 70 256 70 
             C 212 70 182 100 182 140 
             L 182 200" 
             stroke="#00ff41" stroke-width="25" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- 3. The Lock Body / Audio Player Interface -->
    <rect x="136" y="200" width="240" height="180" rx="10" fill="#001a05" stroke="#00ff41" stroke-width="4" filter="url(#glow)"/>

    <!-- 4. Audio Visualization Bars (The "Kugou" aspect) -->
    <g fill="#00ff41" filter="url(#glow)">
        <rect class="bar" x="160" y="260" width="25" height="40" />
        <rect class="bar" x="200" y="250" width="25" height="50" />
        <rect class="bar" x="240" y="240" width="25" height="60" />
        <rect class="bar" x="280" y="255" width="25" height="45" />
        <rect class="bar" x="320" y="270" width="25" height="30" />
    </g>

    <!-- 5. Decorative "KG" and Decrypt elements -->
    <!-- Binary Background Noise -->
    <text x="60" y="100" fill="#00ff41" font-family="monospace" font-size="14" opacity="0.3">01010011</text>
    <text x="60" y="120" fill="#00ff41" font-family="monospace" font-size="14" opacity="0.3">11001010</text>
    <text x="380" y="450" fill="#00ff41" font-family="monospace" font-size="14" opacity="0.3">KG_AUDIO</text>

    <!-- "KG" Logo Mark in Pixel/Hex Style -->
    <path d="M 400 400 L 420 400 L 420 420 L 440 420 L 440 400 L 460 400" stroke="#00ff41" stroke-width="2" fill="none" opacity="0.5"/>
    
    <!-- Status Text -->
    <text x="150" y="360" fill="#00ff41" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="2">UNLOCKED</text>
    
    <!-- Command Prompt Cursor -->
    <rect x="60" y="440" width="15" height="25" fill="#00ff41"/>
    <text x="80" y="458" fill="#00ff41" font-family="monospace" font-size="20">> DECRYPT</text>

    <!-- 6. Screen Overlay Effects -->
    <!-- Scanlines -->
    <rect x="20" y="20" width="472" height="472" rx="40" fill="url(#scanlines)" style="pointer-events:none;"/>
    
    <!-- Screen Glare -->
    <path d="M 20 20 Q 256 100 492 20 L 492 492 L 20 492 Z" fill="#fff" opacity="0.03" style="pointer-events:none;"/>
</svg>
